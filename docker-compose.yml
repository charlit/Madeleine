services:
  madeleine:
    build: .
    container_name: madeleine
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8083

  arena:
    build: ./arena
    container_name: arena
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
